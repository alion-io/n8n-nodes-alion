name: n8n scan

# n8n's own verification scanner against the published package (provenance, attested source, lint).
# Runs after every publish and on demand.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish]
    types: [completed]

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan the latest published version
        run: |
          set -o pipefail
          npx -y @n8n/scan-community-package@latest @alion-io/n8n-nodes-alion 2>&1 | cat
